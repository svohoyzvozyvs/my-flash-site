<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Flash 游戏播放器</title>
    <style>
        body {
            margin: 0;
            background: #222;
            /* 使用 vw 和 vh 确保占满整个视口，并隐藏可能出现的滚动条 */
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        /* 【新增】强制 Ruffle 自定义元素占满父容器 */
        ruffle-player {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<div id="player"></div>

<script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
        "letterbox": "on",         // 保持游戏原生比例并等比放大，多余部分留黑边
        "autoplay": "on",          // 自动播放
        "unmuteOverlay": "visible" // 现代浏览器要求用户交互后才能播放音频，显示点击取消静音的遮罩层
    };
</script>

<script src="ruffle/ruffle.js"></script>

<script>
    window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("player");
        container.appendChild(player);

        // 从 URL 获取游戏路径 (?game=xxx.swf)
        const urlParams = new URLSearchParams(window.location.search);
        const gamePath = urlParams.get('game');

        if (gamePath) {
            // 提取 SWF 所在目录作为 base URL，以便正确解析相对路径资源（如 levels/*.xml）
            const baseUrl = gamePath.substring(0, gamePath.lastIndexOf('/') + 1);
            player.load({
                url: gamePath,
                base: baseUrl
            });
        } else {
            alert("没有指定游戏文件！");
        }
    });
</script>
</body>

</html>
